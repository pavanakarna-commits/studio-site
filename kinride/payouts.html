<!doctype html><html lang="en"><head><title>Kinride — Payouts</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>
:root{--bg:#fff;--fg:#1c1c1e;--muted:#6b6b70;--accent:#0a84ff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--muted:#a1a1a6}}
body{background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;max-width:680px;margin:0 auto;padding:32px 16px}
h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 24px}a{color:var(--accent)}
.button{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:12px;padding:12px 22px}
</style>
</head><body>
<!-- Stripe Connect returns drivers here after onboarding (return) or when a link expired (refresh).
     The page hands straight back to the app, which then checks the payout status with Stripe. -->
<h1>Kinride</h1><p class="sub">Payouts</p>
<p id="msg">Taking you back to Kinride…</p>
<p><a class="button" id="back" href="kinride://payouts">Back to Kinride</a></p>
<p class="sub">If nothing happens, tap the button. You can close this page.</p>
<script>
(function () {
  "use strict";
  var state = new URLSearchParams(location.search).get("state") === "refresh" ? "refresh" : "return";
  var target = "kinride://payouts?state=" + state;
  document.getElementById("back").href = target;
  if (state === "refresh") {
    document.getElementById("msg").textContent = "That setup link expired. Kinride will open a fresh one.";
  }
  location.replace(target);
})();
</script>
</body></html>
